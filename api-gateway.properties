server.port=9191

# Service Discovery (Eureka)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Route for Service One
spring.cloud.gateway.routes[0].id=quiz-route
spring.cloud.gateway.routes[0].uri=lb://QUIZSERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/quiz/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# Route for Service Two
spring.cloud.gateway.routes[1].id=question-route
spring.cloud.gateway.routes[1].uri=lb://QUESTIONSERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/questions/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
